[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./deployments.json" }]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
lasna = "${LASNA_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
lasna = { key = "${LASNA_API_KEY}", url = "https://reactscan.io" }
